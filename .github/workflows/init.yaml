name: Placeholder

on: 
  push:
    branches: main
  repository_dispatch:
    types:
      - triggering_from_postman
  workflow_dispatch:
   inputs:
     name:
      description: "nom de l'utilisateur qui a declenche le workflow"
      required: true
      type: string
     role:
      description: "Fonction de l'utilisateur"
      required: true
      type: string
     
 

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
      - name: Run a one-line script
        run: echo Hello, world!
  dump_contexts_to_log:
    runs-on: ubuntu-latest
    steps:
      - name: dump external data
        run: |
          echo "URL=${{ github.event.client_payload.url }}" >> $GITHUB_OUTPUT
          echo "The external endPoint that triggered le workflow is: $URL"
          echo "The external endPoint that triggered le workflow is: ${{ github.event.client_payload.url }}"
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"
      - name: Dump steps context
        env:
          STEPS_CONTEXT: ${{ toJson(steps) }}
        run: echo "$STEPS_CONTEXT"
      - name: Dump runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"
      - name: Dump strategy context
        env:
          STRATEGY_CONTEXT: ${{ toJson(strategy) }}
        run: echo "$STRATEGY_CONTEXT"
      - name: Dump matrix context
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        run: echo "$MATRIX_CONTEXT"
